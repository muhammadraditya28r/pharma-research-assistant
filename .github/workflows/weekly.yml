name: Weekly Pharmaceutical Research Digest

on:
  schedule:
    - cron: "0 13 * * 5" # Friday 20:00 WIB (UTC+7)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-pharma-research-digest
  cancel-in-progress: false

jobs:
  weekly-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest
      - name: Generate and email digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
          LOOKBACK_DAYS: "45"
          MAX_RESULTS_PER_QUERY: "50"
          MAX_TOTAL_CANDIDATES: "250"
        run: python -m pharma_research_assistant.main
      - name: Commit digest and history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/research_history.json briefs/
          if ! git diff --cached --quiet; then
            git commit -m "chore: archive weekly pharmaceutical research digest"
            git push
          fi
