[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pharma-research-assistant"
version = "0.1.0"
description = "Weekly pharmaceutical analytical science literature digest"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32.0",
  "google-genai>=1.0.0",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
pharma-research = "pharma_research_assistant.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
